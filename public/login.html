<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - FocusLearn</title>
    <link rel="stylesheet" href="/styles/global.css">
    <style>
        body { margin: 0; padding: 0; display: flex; min-height: 100vh; font-family: var(--font-main); background-color: var(--bg); color: var(--text); }
        .split-hero { flex: 1; background: url('/images/login_hero.png') no-repeat center center; background-size: cover; position: relative; }
        .split-hero::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(15,23,42,0.3), var(--bg)); }
        
        .split-form { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card { max-width: 400px; width: 100%; text-align: left; background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        @media (max-width: 768px) {
            .split-hero { display: none; }
        }
    </style>
</head>
<body>
    <div class="split-hero animate-fade-in">
        <div style="position:absolute; bottom: 4rem; left: 4rem; z-index:10;">
            <h1 style="font-size: 4rem; color: #fff; margin-bottom: 0;">FocusLearn</h1>
            <p style="font-size: 1.5rem; color: #cbd5e1; max-width: 500px;">AI-Powered structure for your learning journey.</p>
        </div>
    </div>
    
    <div class="split-form animate-fade-in">
        <div class="auth-card">
            <h1 style="text-align:center; color: var(--primary); margin-bottom: 2rem;">Welcome Back</h1>
            <form id="loginForm">
                <div class="mb-2">
                    <label>Username</label>
                    <input type="text" id="username" required style="width: 100%; padding: 0.75rem 1rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" id="password" required style="width: 100%; padding: 0.75rem 1rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);">
                </div>
                <button type="submit" class="btn" style="width: 100%;" id="loginBtn">Log In</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
                Don't have an account? <a href="/signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('focuslearn_userId', data.userId);
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Login failed');
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
