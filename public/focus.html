<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Focus Mode - FocusLearn</title>
    <link rel="stylesheet" href="/styles/global.css">
    <!-- Include Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: var(--font-main); 
            margin: 0;
            overflow-x: hidden;
        }

        /* Theater Mode / Lockdown UI */
        .video-theater {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: #111;
            box-shadow: 0 0 100px rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }

        .lockdown-footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            padding: 0 1rem;
        }

        .lockdown-msg {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Immersive Background */
        .immersive-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--focus-bg, url('/images/hero_bg.png')) center/cover no-repeat;
            z-index: -1;
            filter: brightness(0.2) blur(5px);
            transition: background 0.8s ease;
        }

        .app-container { min-height: 100vh; display: flex; position: relative; z-index: 1; }
        
        .zen-workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 2rem; }
        
        .timer-container { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; }
        
        .timer-circle { width: 100%; height: 100%; position: absolute; top:0; left:0; transform: rotate(-90deg); }
        .timer-circle circle { fill: none; stroke-width: 12; stroke-linecap: round; }
        .timer-circle .bg { stroke: rgba(255,255,255,0.05); }
        .timer-circle .progress { stroke: var(--primary); stroke-dasharray: 879; /* 2 * pi * r (140) */ stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 10px var(--primary)); }
        
        .timer-display { font-size: 5rem; font-weight: 800; font-variant-numeric: tabular-nums; z-index: 10; text-shadow: 0 0 20px rgba(99,102,241,0.5); }
        
        .controls { display: flex; gap: 1rem; z-index: 10; margin-bottom: 3rem; }
        .controls button { font-size: 1.2rem; padding: 0.75rem 2rem; border-radius: 999px; }
        
        .task-detail { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 2rem; width: 100%; max-width: 800px; backdrop-filter: blur(15px); }
        
        .notes-area { width: 100%; height: 200px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 1rem; border-radius: 8px; font-family: monospace; resize: vertical; margin-top: 1rem; }
        
        .markdown-preview { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 8px; margin-top: 1rem; display: none; min-height: 200px; }
        
        #exitBtn { position: absolute; top: 2rem; left: 2rem; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        #exitBtn:hover { background: rgba(255,255,255,0.1); }
        
        #fullscreenBtn { position: absolute; top: 2rem; right: 2rem; background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        #fullscreenBtn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 15px rgba(99,102,241,0.5);}

        /* Quiz UI */
        .quiz-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .quiz-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .quiz-option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 1.1rem;
        }

        .quiz-option-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateX(10px);
        }

        .quiz-option-btn.correct { background: var(--success); border-color: var(--success); }
        .quiz-option-btn.wrong { background: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>
    <div class="immersive-bg" id="immersiveBg"></div>

    <div class="app-container">
        <!-- Main Workspace -->
        <main class="zen-workspace animate-fade-in" id="workspace">
            <button id="exitBtn" onclick="window.location.href='/dashboard.html'">← Back to Dashboard</button>
            <button id="fullscreenBtn" onclick="window.toggleFullscreen()">Distraction Free</button>

            <!-- Circular Timer -->
            <div class="timer-container">
                <svg class="timer-circle" viewBox="0 0 300 300">
                    <circle class="bg" cx="150" cy="150" r="140"></circle>
                    <circle class="progress" id="timerProgress" cx="150" cy="150" r="140"></circle>
                </svg>
                <div class="timer-display" id="timeDisplay">25:00</div>
            </div>

            <div class="controls">
                <button class="btn" id="startBtn">Start Focus</button>
                <button class="btn btn-outline" id="pauseBtn" style="display:none; border-color: rgba(255,255,255,0.2); color:#fff;">Pause</button>
                <button class="btn btn-outline" id="resetBtn" style="border-color: rgba(255,255,255,0.2); color:#fff;">Reset</button>
            </div>

            <!-- Task Detail & Smart Notes -->
            <div class="task-detail">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1rem;">
                    <h2 id="taskTitle" style="margin:0;">Loading Task...</h2>
                    <span class="text-muted" id="taskDay"></span>
                </div>
                
                <div id="resourceLinks" style="margin-bottom: 2rem;"></div>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0; color:var(--primary);">Smart Notes</h3>
                    <div>
                        <button class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" id="togglePreviewBtn">Show Preview</button>
                        <button class="btn" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;" id="saveNotesBtn">Save Output</button>
                    </div>
                </div>

                <textarea id="notesArea" class="notes-area" placeholder="Type your notes in Markdown here..."></textarea>
                <div id="markdownPreview" class="markdown-preview"></div>
                <div id="saveToast" style="display:none; color: var(--success); font-size: 0.875rem; margin-top: 0.5rem;">Notes saved automatically to database!</div>
                
                <button class="btn mb-4" style="width:100%; margin-top: 2rem; background: var(--success);" id="finishTaskBtn">Finish & Knowledge Check</button>
            </div>
        </main>
    </div>

    <!-- Resource-Specific Quiz Overlay -->
    <div class="quiz-overlay" id="quizOverlay">
        <div class="quiz-card animate-fade-in">
            <div id="quizHeader" class="mb-4">
                <h2 style="color:var(--primary); margin-bottom: 0.25rem;">Knowledge Check 🧠</h2>
                <div id="quizResourceTitle" class="text-muted" style="font-size: 0.9rem;"></div>
            </div>
            
            <!-- Progress Bar -->
            <div style="width:100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 99px; margin-bottom: 2rem; overflow:hidden;">
                <div id="quizProgressBar" style="width: 0%; height:100%; background: var(--primary); transition: width 0.3s ease;"></div>
            </div>

            <div id="quizQuestionContainer">
                <h3 id="quizQuestion" style="min-height: 80px; display: flex; align-items: center; justify-content: center;">Loading Question...</h3>
                <div class="quiz-options" id="quizOptions"></div>
            </div>

            <div id="quizResultWrapper" style="display:none;">
                <h2 id="finalScoreText" style="font-size: 3rem; margin-bottom: 0.5rem;">0%</h2>
                <p id="finalFeedback" style="font-size: 1.2rem; margin-bottom: 2rem; font-weight: 600;"></p>
                <div id="correctAnswersReview" style="text-align: left; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 12px; margin-bottom: 2rem; font-size: 0.9rem; display:none;"></div>
                <button class="btn" onclick="closeQuiz()" style="width:100%;">Done</button>
            </div>
            
            <p id="quizStepInfo" class="text-muted mt-4" style="font-size: 0.8rem;">Question 1 of 3</p>
        </div>
    </div>

    <script type="module">
        import { getOrCreateUserId, fetchUserGoals, syncUserFocusTime, updateTaskNotes, submitResourceQuiz } from './js/utils.js';
        
        let timerInterval;
        const FULL_TIME = 25 * 60; 
        let timeLeft = FULL_TIME; 
        let isRunning = false;
        let currentTask = null;
        let activeTaskId = localStorage.getItem('focuslearn_activeTask');
        let ytPlayer = null;

        // Quiz session state
        let quizState = {
            resourceIndex: -1,
            questions: [],
            answers: [],
            currentStep: 0
        };
        
        const timeDisplay = document.getElementById('timeDisplay');
        const timerProgress = document.getElementById('timerProgress');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const notesArea = document.getElementById('notesArea');

        const CIRCUMFERENCE = 2 * Math.PI * 140; 

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${m}:${s}`;
            const strokeOffset = CIRCUMFERENCE - (timeLeft / FULL_TIME) * CIRCUMFERENCE;
            timerProgress.style.strokeDashoffset = strokeOffset;
        }

        async function handletimerComplete() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
            alert('Focus session complete!');
            try { await syncUserFocusTime(25); } catch(e) {}
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) return;
            isRunning = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateDisplay(); } else { handletimerComplete(); }
            }, 1000);
        });

        pauseBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
            startBtn.textContent = 'Resume';
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = FULL_TIME;
            updateDisplay();
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        });

        window.toggleFullscreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fullscreenBtn').textContent = 'Exit Distraction Free';
            } else {
                document.exitFullscreen();
                document.getElementById('fullscreenBtn').textContent = 'Distraction Free';
            }
        };

        document.getElementById('saveNotesBtn').addEventListener('click', async () => {
            if(!activeTaskId) return;
            try {
                await updateTaskNotes(activeTaskId, notesArea.value);
                const toast = document.getElementById('saveToast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display='none', 3000);
            } catch(e) {}
        });

        // Lockdown Video Logic
        window.openTheaterMode = (ytUrl) => {
            const videoId = extractYTId(ytUrl);
            if (!videoId) return alert('Invalid YouTube URL');

            document.getElementById('videoTheater').style.display = 'flex';
            document.getElementById('exitBtn').disabled = true;
            document.getElementById('fullscreenBtn').disabled = true;
            
            // Initialize Player
            if (ytPlayer) {
                ytPlayer.loadVideoById(videoId);
            } else {
                ytPlayer = new YT.Player('ytPlayer', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        };

        function extractYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                // Unlock
                const forceExitBtn = document.getElementById('forceExitBtn');
                forceExitBtn.disabled = false;
                forceExitBtn.textContent = "Unlock Focus Mode";
                forceExitBtn.style.color = "var(--success)";
                forceExitBtn.style.borderColor = "var(--success)";
                forceExitBtn.onclick = () => {
                    document.getElementById('videoTheater').style.display = 'none';
                    document.getElementById('exitBtn').disabled = false;
                    document.getElementById('fullscreenBtn').disabled = false;
                    ytPlayer.stopVideo();
                };
            }
        }

        // Advanced Quiz Logic
        window.startResourceQuiz = (resourceIndex) => {
            const resource = currentTask.resources[resourceIndex];
            if (!resource || !resource.questions || resource.questions.length === 0) {
                return alert('This resource does not have a quiz yet.');
            }
            
            quizState = {
                resourceIndex,
                questions: resource.questions,
                answers: [],
                currentStep: 0
            };

            document.getElementById('quizOverlay').style.display = 'flex';
            document.getElementById('quizResourceTitle').textContent = `Assessing: ${resource.title}`;
            document.getElementById('quizQuestionContainer').style.display = 'block';
            document.getElementById('quizResultWrapper').style.display = 'none';
            document.getElementById('quizStepInfo').style.display = 'block';
            
            renderQuizStep();
        };

        function renderQuizStep() {
            const q = quizState.questions[quizState.currentStep];
            document.getElementById('quizQuestion').textContent = q.question;
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });

            const progress = ((quizState.currentStep) / quizState.questions.length) * 100;
            document.getElementById('quizProgressBar').style.width = `${progress}%`;
            document.getElementById('quizStepInfo').textContent = `Question ${quizState.currentStep + 1} of ${quizState.questions.length}`;
        }

        async function selectOption(index) {
            quizState.answers.push(index);
            if (quizState.currentStep < quizState.questions.length - 1) {
                quizState.currentStep++;
                renderQuizStep();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            document.getElementById('quizProgressBar').style.width = `100%`;
            try {
                const result = await submitResourceQuiz(activeTaskId, quizState.resourceIndex, quizState.answers);
                
                document.getElementById('quizQuestionContainer').style.display = 'none';
                document.getElementById('quizStepInfo').style.display = 'none';
                document.getElementById('quizResultWrapper').style.display = 'flex';
                document.getElementById('finalScoreText').textContent = `${result.score}%`;
                document.getElementById('finalFeedback').textContent = result.feedback;
                
                const reviewBox = document.getElementById('correctAnswersReview');
                reviewBox.style.display = 'block';
                reviewBox.innerHTML = '<strong>Answer Key:</strong><br>' + 
                    result.correctAnswers.map((ca, i) => `Q${i+1}: ${quizState.questions[i].options[ca]}`).join('<br>');
                
                if (result.score >= 80) {
                    document.getElementById('finalScoreText').style.color = 'var(--success)';
                } else if (result.score < 50) {
                    document.getElementById('finalScoreText').style.color = 'var(--danger)';
                }
                
            } catch (e) {
                alert('Quiz submission failed');
            }
        }

        window.closeQuiz = () => {
            document.getElementById('quizOverlay').style.display = 'none';
            loadTask(); // refresh view
        };

        async function loadTask() {
            if(!activeTaskId) return;
            try {
                const goals = await fetchUserGoals();
                let selectedTask = null;
                let selectedGoal = null;
                
                goals.forEach(g => {
                    const t = g.tasks.find(ts => ts._id === activeTaskId);
                    if(t) { selectedTask = t; selectedGoal = g; }
                });
                
                if(selectedTask) {
                    currentTask = selectedTask;
                    document.getElementById('taskTitle').textContent = selectedTask.title;
                    document.getElementById('taskDay').textContent = `Day ${selectedTask.day}`;
                    notesArea.value = selectedTask.notes || '';
                    
                    let bg = "url('/images/hero_bg.png')";
                    if(selectedGoal.title === 'Web Development') bg = "url('/images/course_web_dev.png')";
                    else if(selectedGoal.title === 'Data Science') bg = "url('/images/course_data_sci.png')";
                    else if(selectedGoal.title === 'Artificial Intelligence') bg = "url('/images/course_ai.png')";
                    else if(selectedGoal.title === 'UI/UX Design') bg = "url('/images/course_design.png')";
                    document.getElementById('immersiveBg').style.setProperty('--focus-bg', bg);

                    if(selectedTask.resources && selectedTask.resources.length > 0) {
                        let resHtml = '<h4>Learning Resources:</h4><div style="display:grid; gap: 1rem; margin-top: 1rem;">';
                        selectedTask.resources.forEach((r, idx) => {
                            const isDone = r.completed ? '✓ Mastery Achieved' : 'Take Quiz';
                            resHtml += `
                                <div style="background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                        <div>
                                            <button onclick="openTheaterMode('${r.url}')" style="background:none; border:none; text-align:left; padding:0; cursor:pointer;">
                                                <span style="color:var(--primary); font-weight:700; text-decoration:none; font-size:1.1rem;">📺 ${r.title}</span>
                                            </button>
                                            <p style="font-size: 0.875rem; color: #94a3b8; margin-top: 0.5rem;">${r.description || ''}</p>
                                        </div>
                                        <button class="btn" style="background: ${r.completed ? 'var(--success)' : 'var(--primary)'}; padding: 0.5rem 1rem; font-size:0.8rem;" onclick="startResourceQuiz(${idx})">${isDone}</button>
                                    </div>
                                    <div style="margin-top: 1rem; display:flex; gap: 1rem; align-items:center;">
                                         <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;" onclick="openTheaterMode('${r.url}')">Start Mastery Watch</button>
                                         ${r.bestScore > 0 ? `<div style="font-size: 0.75rem; color: #64748b;">Best Score: ${r.bestScore}% | Attempts: ${r.attempts}</div>` : ''}
                                    </div>
                                </div>
                            `;
                        });
                        resHtml += '</div>';
                        document.getElementById('resourceLinks').innerHTML = resHtml;
                    }
                }
            } catch(e) {}
        }
        
        loadTask();
        updateDisplay();
    </script>
</body>
</html>
